name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck app + server
        run: npm run typecheck && npm run typecheck:server

      - name: Repo-wide typecheck (tsc -b --noEmit)
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Targeted bug-fix tests
        run: npm test
