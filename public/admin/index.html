<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <title>Lazy Cloud — Admin & Store</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            slate: {
              950: '#020617',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .glass { background: rgba(15,23,42,0.6); backdrop-filter: blur(16px); border: 1px solid rgba(30,41,59,0.8); }
    .glass-strong { background: rgba(15,23,42,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(30,41,59,0.9); }
    .glow-emerald { box-shadow: 0 0 24px rgba(16,185,129,0.15), 0 0 48px rgba(16,185,129,0.08); }
    .glow-cyan { box-shadow: 0 0 24px rgba(34,211,238,0.12), 0 0 48px rgba(34,211,238,0.06); }
    .glow-indigo { box-shadow: 0 0 24px rgba(99,102,241,0.12), 0 0 48px rgba(99,102,241,0.06); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    .slide-in { animation: slideIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes progressBar { 0% { width: 0%; } 100% { width: var(--progress); } }
    .progress-animated { animation: progressBar 1.2s cubic-bezier(0.4,0,0.2,1) forwards; }
    .tooltip { position: relative; }
    .tooltip:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: #1e293b; color: #cbd5e1; font-size: 11px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 50; border: 1px solid #334155; margin-bottom: 4px; font-family: 'Inter', sans-serif; }
    input[type="range"] { -webkit-appearance: none; height: 4px; background: #1e293b; border-radius: 2px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #10b981; border-radius: 50%; cursor: pointer; border: 2px solid #020617; }
    select, input, textarea { color-scheme: dark; }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-200 antialiased overflow-hidden">

<!-- ══ BACKGROUND ══ -->
<div class="fixed inset-0 -z-10 overflow-hidden">
  <div class="absolute inset-0 bg-gradient-to-br from-emerald-950/20 via-slate-950 to-indigo-950/20"></div>
  <div class="absolute top-0 left-1/4 w-96 h-96 bg-emerald-500/5 rounded-full blur-3xl"></div>
  <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-indigo-500/5 rounded-full blur-3xl"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-125 h-125 bg-sky-500/3 rounded-full blur-3xl"></div>
</div>

<div id="app" class="flex h-full">

  <!-- ══ SIDEBAR ══ -->
  <aside class="w-64 shrink-0 glass border-r border-slate-800/80 flex flex-col h-full z-20 relative">
    <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-800/80">
      <div class="relative">
        <img src="../favicon.svg" alt="Lazy Cloud" class="w-8 h-8" onerror="this.src='../logo.svg'" />
        <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 rounded-full border-2 border-slate-950 pulse-dot"></div>
      </div>
      <div>
        <div class="font-800 text-sm font-bold text-white tracking-tight" style="letter-spacing:-0.02em">Lazy<span class="text-emerald-400">Cloud</span></div>
        <div class="text-[10px] text-slate-500 font-mono">ADMIN_PANEL</div>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1" id="sidebarNav">
      <!-- Nav items rendered by JS -->
    </nav>

    <!-- Storage gauge in sidebar -->
    <div class="px-4 py-4 border-t border-slate-800/80">
      <div class="text-[11px] text-slate-500 font-mono mb-2 flex justify-between">
        <span>STORAGE</span>
        <span id="sidebarStorageText">420 GB / 2 TB</span>
      </div>
      <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden">
        <div id="sidebarStorageBar" class="h-full bg-gradient-to-r from-emerald-500 to-sky-500 rounded-full transition-all duration-700" style="width: 20.5%"></div>
      </div>
      <div class="mt-1.5 text-[10px] text-slate-600 font-mono" id="sidebarStoragePct">20.5% used</div>
    </div>

    <!-- Admin profile -->
    <div class="px-4 py-3 border-t border-slate-800/80 flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-500 to-indigo-600 flex items-center justify-center text-xs font-bold text-white">AD</div>
      <div class="flex-1 min-w-0">
        <div class="text-xs font-semibold text-white truncate">Administrator</div>
        <div class="text-[10px] text-emerald-400 font-mono">● online</div>
      </div>
      <button onclick="toggleNotifications()" class="p-1.5 rounded-lg hover:bg-slate-800/60 text-slate-500 hover:text-slate-300 transition-colors" aria-label="Notifications" aria-expanded="false" id="notifSidebarBtn">
        <i data-lucide="bell" class="w-4 h-4"></i>
      </button>
    </div>
  </aside>

  <!-- ══ MAIN ══ -->
  <main class="flex-1 flex flex-col min-w-0 h-full">

    <!-- Header -->
    <header class="glass-strong border-b border-slate-800/80 px-6 py-4 flex items-center gap-4 z-10">
      <!-- Search -->
      <div class="flex-1 max-w-md relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
        <input type="search" id="globalSearch" placeholder="Search files, products, orders…" autocomplete="off" spellcheck="false" class="w-full bg-slate-800/50 border border-slate-700/50 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-emerald-500/50 focus:ring-2 focus:ring-emerald-500/20 transition" oninput="onGlobalSearch(this.value)" />
      </div>

      <!-- Right side -->
      <div class="flex items-center gap-2 ml-auto">
        <!-- Revenue chip -->
        <button onclick="switchTab('overview')" class="hidden sm:flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-3 py-2 hover:bg-emerald-500/15 transition-colors tooltip" data-tip="Total Revenue">
          <i data-lucide="trending-up" class="w-4 h-4 text-emerald-400"></i>
          <span class="text-sm font-bold text-emerald-400 font-mono" id="headerRevenue">$12,840</span>
        </button>

        <!-- Store preview toggle -->
        <button onclick="toggleStorePreview()" id="storePreviewBtn" class="flex items-center gap-2 bg-sky-500/10 border border-sky-500/30 rounded-xl px-3 py-2 hover:bg-sky-500/15 transition-colors tooltip" data-tip="View Store">
          <i data-lucide="store" class="w-4 h-4 text-sky-400"></i>
          <span class="hidden sm:inline text-sm font-medium text-sky-400">Store</span>
        </button>

        <!-- Notifications -->
        <div class="relative">
          <button onclick="toggleNotifications()" class="p-2 rounded-xl hover:bg-slate-800/60 text-slate-400 hover:text-slate-200 transition-colors relative" aria-label="Notifications" aria-expanded="false" id="notifBtn">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute top-1 right-1 w-2 h-2 bg-emerald-400 rounded-full"></span>
          </button>
          <div id="notifDrawer" class="hidden absolute right-0 top-full mt-2 w-80 glass-strong rounded-2xl shadow-2xl z-50 overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
              <span class="text-sm font-semibold text-white">Notifications</span>
              <button onclick="clearNotifications()" class="text-xs text-slate-500 hover:text-slate-300">Clear all</button>
            </div>
            <div id="notifList" class="max-h-72 overflow-y-auto"></div>
          </div>
        </div>

        <!-- Admin profile dropdown -->
        <div class="relative">
          <button onclick="toggleProfileMenu()" class="flex items-center gap-2 p-1.5 rounded-xl hover:bg-slate-800/60 transition-colors" aria-label="Admin menu" aria-expanded="false" id="profileBtn">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-500 to-indigo-600 flex items-center justify-center text-xs font-bold text-white">AD</div>
            <i data-lucide="chevron-down" class="w-3 h-3 text-slate-500 hidden sm:block"></i>
          </button>
          <div id="profileMenu" class="hidden absolute right-0 top-full mt-2 w-48 glass-strong rounded-2xl shadow-2xl z-50 overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-800">
              <div class="text-sm font-semibold text-white">Administrator</div>
              <div class="text-xs text-slate-500">admin@lazycloud.io</div>
            </div>
            <div class="py-1">
              <button onclick="switchTab('settings')" class="w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-colors flex items-center gap-2"><i data-lucide="settings" class="w-3.5 h-3.5"></i>Settings</button>
              <button onclick="showToast('Session ending soon — implement auth to continue', 'info')" class="w-full text-left px-4 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-colors flex items-center gap-2"><i data-lucide="shield" class="w-3.5 h-3.5"></i>Security</button>
              <button onclick="showToast('Manual logout requires auth backend', 'warning')" class="w-full text-left px-4 py-2 text-sm text-rose-400 hover:bg-slate-800 transition-colors flex items-center gap-2"><i data-lucide="log-out" class="w-3.5 h-3.5"></i>Sign Out</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page content area -->
    <div class="flex-1 overflow-y-auto px-6 py-6" id="mainContent">
      <!-- Content rendered by JS -->
    </div>
  </main>
</div>

<!-- ══ TOAST CONTAINER ══ -->
<div id="toastContainer" class="fixed top-5 right-5 z-[100] flex flex-col gap-2 items-end"></div>

<!-- ══ MODAL ROOT ══ -->
<div id="modalRoot"></div>

<!-- ══ STORE PREVIEW ROOT ══ -->
<div id="storePreviewRoot"></div>

<script src="./store.js"></script>
</body>
</html>
