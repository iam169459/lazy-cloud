<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="rocketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Cloud -->
  <ellipse cx="100" cy="155" rx="70" ry="22" fill="#34d399" opacity="0.15"/>
  <ellipse cx="75" cy="148" rx="28" ry="18" fill="#34d399" opacity="0.25"/>
  <ellipse cx="100" cy="145" rx="35" ry="22" fill="#34d399" opacity="0.3"/>
  <ellipse cx="125" cy="148" rx="28" ry="18" fill="#34d399" opacity="0.25"/>

  <!-- Trail -->
  <ellipse cx="100" cy="170" rx="40" ry="12" fill="#34d399" opacity="0.1"/>

  <!-- Rocket body -->
  <g transform="translate(100, 90)">
    <!-- Flame outer -->
    <ellipse cx="0" cy="52" rx="9" ry="18" fill="url(#flameGrad)" filter="blur(1px)">
      <animate attributeName="ry" values="18;22;16;20;18" dur="0.12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.85;1;0.9;1" dur="0.12s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Flame inner -->
    <ellipse cx="0" cy="44" rx="5" ry="12" fill="url(#flameInner)" filter="blur(0.5px)">
      <animate attributeName="ry" values="12;15;10;13;12" dur="0.08s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.8;1;0.9" dur="0.08s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Rocket body -->
    <rect x="-16" y="-30" width="32" height="56" rx="16" fill="url(#rocketGrad)"/>
    <rect x="-16" y="-30" width="32" height="56" rx="16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>

    <!-- Nose cone -->
    <path d="M-16,-30 L0,-52 L16,-30 Z" fill="url(#rocketGrad)"/>

    <!-- Cockpit window -->
    <circle cx="0" cy="-14" r="6" fill="url(#flameGrad)" opacity="0.6"/>
    <circle cx="-2" cy="-16" r="2" fill="white" opacity="0.5"/>

    <!-- Fins -->
    <path d="M-16,20 L-28,36 L-16,36 Z" fill="#ef4444"/>
    <path d="M16,20 L28,36 L16,36 Z" fill="#ef4444"/>

    <!-- Stripe -->
    <rect x="-12" y="8" width="24" height="3" rx="1.5" fill="#34d399" filter="blur(0.5px)"/>

    <!-- Orbiting files -->
    <g>
      <text x="-24" y="-20" fontSize="10" opacity="0.7">📄</text>
      <text x="24" y="-20" fontSize="10" opacity="0.7">📁</text>
      <text x="-24" y="-8" fontSize="10" opacity="0.7">📎</text>
      <text x="24" y="-8" fontSize="10" opacity="0.7">💾</text>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
